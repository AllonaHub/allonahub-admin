<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Şifre Sıfırla | AllonaHub</title>
  <meta name="description" content="AllonaHub şifre sıfırlama.">
  <link rel="stylesheet" href="css/styles.v2.css?v=20260619-live1">
  <link rel="stylesheet" href="css/platform.css?v=20260619-live1">
</head>
<body>
  <div class="site-shell">
    <div data-layout="header"></div>
    <main class="site-main auth-layout">
      <section class="auth-card">
        <div>
          <p class="eyebrow">Hesap</p>
          <h1>Şifre Sıfırla</h1>
        </div>
        <div data-auth-status></div>
        <form data-forgot-form>
          <div class="field">
            <label for="forgot-email">E-posta</label>
            <input id="forgot-email" type="email" name="email" required autocomplete="email">
          </div>
          <div class="form-actions">
            <button class="btn btn--full" type="submit">Bağlantı Gönder</button>
          </div>
        </form>
        <p class="auth-switch"><a href="login.html">Girişe dön</a></p>
      </section>
    </main>
    <div data-layout="footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js?v=20260619-live1" defer></script>
  <script src="js/core.js?v=20260619-live1" defer></script>
  <script src="js/supabase-client.js?v=20260619-live1" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/layout.v3.js?v=20260619-live1" defer></script>
  <script src="js/auth-pages.js" defer></script>
  <script src="js/platform.js?v=20260619-live1" defer></script>
</body>
</html>
