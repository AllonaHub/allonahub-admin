<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Girişi | AllonaHub</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/platform.css?v=20260626-mobile-std27">
  <link rel="stylesheet" href="../css/admin-ops.css?v=20260629-adminlogin1">
</head>
<body class="admin-ops-page admin-login-page" data-page="admin-login">
  <main class="admin-login-shell">
    <form class="admin-login-card" data-admin-login-form>
      <a class="admin-brand" href="../index.html" aria-label="AllonaHub ana sayfa">
        <img src="../images/brand/allona.logo.png" alt="AllonaHub">
        <span>
          <strong><span class="gold">Allona</span><span class="blue">Hub</span></strong>
          <span>Admin Operasyon Girişi</span>
        </span>
      </a>
      <div>
        <p class="admin-login-kicker">Admin-only operations gate</p>
        <h1>Admin Panel Girişi</h1>
        <p>Bu giriş yalnızca admin ve süper admin operasyon hesapları içindir. Müşteri/kullanıcı hesabı bu kapıdan içeri alınmaz.</p>
      </div>
      <label class="admin-login-field">
        E-posta
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <label class="admin-login-field">
        Şifre
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <div class="admin-login-status" data-admin-login-status aria-live="polite" hidden></div>
      <button class="admin-btn admin-btn--primary" type="submit">Admin Olarak Giriş Yap</button>
      <a class="admin-btn" href="./index.html">Admin Panele Dön</a>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../js/config.js?v=20260623-mfa2" defer></script>
  <script src="../js/core.js?v=20260629-media1" defer></script>
  <script src="../js/supabase-client.js?v=20260623-mfa2" defer></script>
  <script src="../js/auth.js?v=20260629-admingate1" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      const App = window.Allona = window.Allona || {};
      const form = document.querySelector("[data-admin-login-form]");
      const status = document.querySelector("[data-admin-login-status]");
      const returnTo = "/admin/index.html";

      function setStatus(message, tone) {
        if (!status) return;
        status.textContent = message || "";
        status.dataset.tone = tone || "";
        status.hidden = !message;
      }

      async function submit(event) {
        event.preventDefault();
        const button = form.querySelector("button[type='submit']");
        button.disabled = true;
        setStatus("Admin oturumu doğrulanıyor...", "warning");
        try {
          const data = new FormData(form);
          const result = await App.auth.signIn(data.get("email"), data.get("password"));
          const user = result && result.user || await App.auth.getUser();
          const profile = user ? await App.auth.getProfile(user.id).catch(function () { return null; }) : null;
          if (profile && !["admin", "super_admin"].includes(profile.role)) {
            setStatus("Oturum alındı. Admin yetkisi panel API tarafından tekrar doğrulanacak.", "warning");
          }

          const mfa = await App.auth.mfaStatus();
          if (mfa && mfa.authenticated && !mfa.mfaVerified) {
            window.location.href = App.core.url("/pages/account/mfa.html?returnTo=" + encodeURIComponent(returnTo));
            return;
          }

          setStatus("Giriş doğrulandı. Admin panele yönlendiriliyorsunuz.", "success");
          window.location.href = App.core.url(returnTo);
        } catch (error) {
          setStatus(error.message || "Admin girişi tamamlanamadı.", "error");
        } finally {
          button.disabled = false;
        }
      }

      if (form) form.addEventListener("submit", submit);
    });
  </script>
</body>
</html>
