<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AllonaHub Admin Paneli</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/platform.css?v=20260630-currency3">
  <link rel="stylesheet" href="../css/admin-ops.css?v=20260629-navalerts1">
</head>
<body class="admin-ops-page" data-page="admin-ops">
  <main class="admin-shell" data-admin-shell>
    <header class="admin-topbar" aria-label="Admin Panel üst bar">
      <a class="admin-brand" href="../index.html" aria-label="AllonaHub ana sayfa">
        <img src="../images/brand/allona.logo.png" alt="AllonaHub">
        <span>
          <strong><span class="gold">Allona</span><span class="blue">Hub</span></strong>
          <span>Admin Operasyon Paneli</span>
        </span>
      </a>

      <div class="admin-searchbar">
        <input id="adminGlobalSearch" type="search" autocomplete="off" placeholder="Kullanıcı, başvuru, sipariş veya talep ara">
        <select id="adminGlobalStatus" aria-label="Durum filtresi">
          <option value="">Tüm durumlar</option>
          <option value="pending">Pending</option>
          <option value="review">Review</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="active">Active</option>
          <option value="paused">Paused</option>
          <option value="suspended">Suspended</option>
          <option value="open">Open</option>
          <option value="in_progress">In progress</option>
          <option value="resolved">Resolved</option>
          <option value="paid">Paid</option>
          <option value="refunded">Refunded</option>
          <option value="cancelled">Cancelled</option>
          <option value="pending_signal">Pending signal</option>
          <option value="hidden">Hidden</option>
        </select>
        <button class="admin-btn admin-btn--primary" type="button" id="adminRefresh">Yenile</button>
      </div>

      <div class="admin-userbox">
        <div class="admin-userbox__meta">
          <strong id="adminProfileName">Admin</strong>
          <span id="adminProfileRole">Doğrulanıyor</span>
        </div>
        <button class="admin-btn" type="button" id="adminSignOut">Çıkış</button>
      </div>
    </header>

    <div class="admin-layout">
      <aside class="admin-sidebar" aria-label="Admin Panel menüsü">
        <nav class="admin-nav" id="adminNav"></nav>
      </aside>

      <div class="admin-main" id="adminContent">
        <div class="admin-status">Panel yükleniyor...</div>
      </div>
    </div>
  </main>

  <aside class="admin-drawer" id="adminDrawer" aria-label="Detay paneli">
    <div class="admin-drawer__head">
      <h2 id="adminDrawerTitle">Detay</h2>
      <button class="admin-btn" type="button" data-drawer-close>Kapat</button>
    </div>
    <div class="admin-drawer__body" id="adminDrawerBody"></div>
  </aside>

  <div class="admin-modal" id="adminModal" aria-hidden="true">
    <form class="admin-modal__panel" id="adminModalForm">
      <div class="admin-modal__head">
        <h2 id="adminModalTitle">Onay</h2>
      </div>
      <div class="admin-modal__body" id="adminModalBody"></div>
      <div class="admin-modal__actions">
        <button class="admin-btn" type="button" id="adminModalCancel">Vazgeç</button>
        <button class="admin-btn admin-btn--primary" type="submit" id="adminModalConfirm">Onayla</button>
      </div>
    </form>
  </div>

  <div class="admin-toast" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../js/config.js?v=20260623-mfa2" defer></script>
  <script src="../js/core.js?v=20260630-currency3" defer></script>
  <script src="../js/supabase-client.js?v=20260623-mfa2" defer></script>
  <script src="../js/auth.js?v=20260629-adminroot1" defer></script>
  <script src="../js/admin-alarm.js?v=20260629-alarmhide1" defer></script>
  <script src="../js/admin-ops.js?v=20260630-productreviews2" defer></script>
</body>
</html>
