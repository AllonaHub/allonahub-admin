services:
  allonahub-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: allonahub-api
    restart: unless-stopped
    env_file:
      - /opt/allonahub/deploy/hetzner/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      ASSISTANT_ENABLED: "true"
      ASSISTANT_AI_PROVIDER: "rules"
      ASSISTANT_AI_API_KEY: ""
      OPENAI_API_KEY: ""
      ASSISTANT_MAX_MESSAGE_CHARS: "1600"
      ASSISTANT_MAX_REPLY_CHARS: "700"
      ASSISTANT_RATE_LIMIT_MAX: "20"
      ASSISTANT_TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_WEBHOOK_SECRET: ""
    expose:
      - "3000"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.middlewares.allonahub-api-gzip.compress: "true"
      traefik.http.middlewares.allonahub-api-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.allonahub-api-ratelimit.ratelimit.average: "120"
      traefik.http.middlewares.allonahub-api-ratelimit.ratelimit.burst: "80"
      traefik.http.middlewares.allonahub-api-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.allonahub-api-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.allonahub-api-headers.headers.stsPreload: "true"
      traefik.http.middlewares.allonahub-api-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.allonahub-api-headers.headers.frameDeny: "true"
      traefik.http.middlewares.allonahub-api-headers.headers.referrerPolicy: no-referrer
      traefik.http.routers.allonahub-api-http.entrypoints: http
      traefik.http.routers.allonahub-api-http.rule: Host(`api.allonahub.com`)
      traefik.http.routers.allonahub-api-http.middlewares: allonahub-api-redirect
      traefik.http.routers.allonahub-api-https.entrypoints: https
      traefik.http.routers.allonahub-api-https.rule: Host(`api.allonahub.com`)
      traefik.http.routers.allonahub-api-https.middlewares: allonahub-api-headers,allonahub-api-ratelimit,allonahub-api-gzip
      traefik.http.routers.allonahub-api-https.tls: "true"
      traefik.http.routers.allonahub-api-https.tls.certresolver: letsencrypt
      traefik.http.services.allonahub-api.loadbalancer.server.port: "3000"

networks:
  coolify:
    external: true
