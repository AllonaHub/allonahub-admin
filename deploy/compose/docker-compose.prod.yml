services:
  allonahub-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: allonahub-api
    restart: unless-stopped
    env_file:
      - ../hetzner/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      MARSOH_TRANSLATION_PROVIDER: "local"
      MARSOH_LOCAL_TRANSLATION_URL: "http://marsoh-translator:8080"
      MARSOH_LOCAL_TRANSLATION_TIMEOUT_MS: "60000"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - marsoh-internal
    depends_on:
      marsoh-translator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  marsoh-translator:
    build:
      context: ../../backend/local-translator
      dockerfile: Dockerfile
    container_name: marsoh-translator
    restart: unless-stopped
    environment:
      PORT: 8080
      CT2_INTRA_THREADS: 3
      MARSOH_TRANSLATOR_MAX_ACTIVE: 4
    expose:
      - "8080"
    networks:
      - marsoh-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 4g
    cpus: "3.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  marsoh-internal:
    internal: true
