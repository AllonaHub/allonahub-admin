<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Allona Shop</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#081325;
color:white;
}

header{
padding:20px;
background:#0b1c35;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
font-size:28px;
font-weight:bold;
color:#ffd54f;
}

.search{
width:50%;
}

.search input{
width:100%;
padding:14px;
border-radius:30px;
border:none;
font-size:16px;
}

.hero{
padding:50px;
text-align:center;
background:linear-gradient(135deg,#0f2f5e,#081325);
}

.hero h1{
font-size:48px;
margin-bottom:10px;
}

.hero p{
font-size:20px;
opacity:.8;
}

.products{
padding:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#102443;
border-radius:20px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.price{
color:#ffd54f;
font-size:22px;
font-weight:bold;
}

.btn{
display:inline-block;
margin-top:10px;
padding:10px 20px;
background:#00bfff;
border-radius:30px;
text-decoration:none;
color:white;
}

</style>
</head>

<body>

<header>
<div class="logo">Allona Shop</div>

<div class="search">
<input type="text" placeholder="Ürün ara...">
</div>

</header>

<section class="hero">
<h1>Allona Shop</h1>
<p>Binlerce ürün tek platformda</p>
</section>

<section class="products">

<div class="card">
<img src="https://picsum.photos/400/400?1">
<div class="card-content">
<h3>Kategori Örneği</h3>
<div class="price">499,99 ₺</div>
<a href="#" class="btn">İncele</a>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/400?2">
<div class="card-content">
<h3>Kategori Örneği</h3>
<div class="price">699,99 ₺</div>
<a href="#" class="btn">İncele</a>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/400?3">
<div class="card-content">
<h3>Kategori Örneği</h3>
<div class="price">899,99 ₺</div>
<a href="#" class="btn">İncele</a>
</div>
</div>

</section>

</body>
</html>
