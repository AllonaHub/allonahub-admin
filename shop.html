<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mağaza | AllonaHub</title>
  <meta name="description" content="AllonaHub aktif ürün kataloğu, kategori ve fiyat filtreleri.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="site-shell" data-page="shop">
    <div data-layout="header"></div>

    <main class="site-main">
      <section class="container page-heading">
        <div>
          <p class="eyebrow">Katalog</p>
          <h1>Mağaza</h1>
          <p>Aktif ürünleri arayın, kategoriye göre filtreleyin ve sepetinize ekleyin.</p>
        </div>
      </section>

      <section class="container">
        <form class="filters" data-product-filters>
          <div class="field">
            <label for="catalog-search">Arama</label>
            <input id="catalog-search" type="search" data-filter-search placeholder="Ürün, kategori veya marka">
          </div>
          <div class="field">
            <label for="catalog-category">Kategori</label>
            <select id="catalog-category" data-filter-category><option value="">Tüm kategoriler</option></select>
          </div>
          <div class="field">
            <label for="catalog-min">Min fiyat</label>
            <input id="catalog-min" type="number" min="0" step="1" data-filter-min>
          </div>
          <div class="field">
            <label for="catalog-max">Max fiyat</label>
            <input id="catalog-max" type="number" min="0" step="1" data-filter-max>
          </div>
          <div class="field">
            <label for="catalog-sort">Sıralama</label>
            <select id="catalog-sort" data-filter-sort>
              <option value="newest">En yeni</option>
              <option value="best_selling">En çok satan</option>
              <option value="price_asc">Fiyat artan</option>
              <option value="price_desc">Fiyat azalan</option>
            </select>
          </div>
        </form>
        <div class="product-grid" data-products-grid></div>
      </section>
    </main>

    <div data-layout="footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="js/shop-page.js" defer></script>
</body>
</html>
