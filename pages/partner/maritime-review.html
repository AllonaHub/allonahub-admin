<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Güvenli Denizcilik İncelemesi | AllonaHub</title>
  <link rel="stylesheet" href="../../css/maritime-review.css?v=20260920-maripartner1">
</head>
<body data-theme="white" data-partner-theme-locked="true">
  <main class="review-shell">
    <header><span aria-hidden="true">A</span><div><strong>AllonaHub Denizcilik</strong><small>Güvenli İnceleme</small></div></header>
    <section class="review-card" data-review-login>
      <p class="eyebrow">Süreli ve alan sınırlı erişim</p>
      <h1>İnceleme geçişini açın</h1>
      <p>Erişim anahtarını ve altı haneli kodu girin. Anahtar adres çubuğuna yazılmaz ve bu cihazda saklanmaz.</p>
      <form data-review-access-form>
        <label><span>Erişim anahtarı</span><input name="token" type="password" required minlength="30" autocomplete="off"></label>
        <label><span>Tek kullanımlık kod</span><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label>
        <button type="submit">İncelemeyi Aç</button>
      </form>
    </section>
    <section class="review-card" data-review-content hidden>
      <p class="eyebrow">Yetkilendirilen aday özeti</p>
      <h1 data-review-title>Güvenli İnceleme</h1>
      <p data-review-purpose></p>
      <dl data-review-fields></dl>
      <form data-review-decision-form>
        <fieldset><legend>Karar</legend><label><input type="radio" name="decision" value="approved" required> Uygun</label><label><input type="radio" name="decision" value="not_suitable"> Uygun değil</label><label><input type="radio" name="decision" value="comment"> Yalnız yorum</label></fieldset>
        <label><span>Yorum</span><textarea name="comment" maxlength="1200"></textarea></label>
        <button type="submit">Kararı Kaydet</button>
      </form>
    </section>
    <p class="review-status" data-review-status role="status" aria-live="polite"></p>
  </main>
  <script src="../../js/config.js?v=20260920-maripartner1" defer></script>
  <script src="../../js/maritime-review.js?v=20260920-maripartner1" defer></script>
</body>
</html>
