<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AllonaHub Partner Ürün Detayı</title>
  <meta name="description" content="AllonaHub partner ürün detay, stok, fiyat, medya ve açıklama düzenleme ekranı.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../css/styles.v2.css?v=20260630-shopcat2">
  <link rel="stylesheet" href="../../css/platform.css?v=20260712-theme-text1">
  <link rel="stylesheet" href="../../css/partner-os.css?v=20260630-productsfix1">
  <link rel="stylesheet" href="../../css/partner-products.css?v=20260701-detailfix1">
</head>
<body>
  <div class="site-shell partner-os-shell partner-products-shell" data-page="partner-product-detail">
    <div data-layout="header"></div>

    <main class="partner-products partner-product-detail" data-product-detail-shell>
      <header class="partner-products-topbar">
        <a class="partner-products-back" href="/pages/partner/partner-products.html">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Ürünlerim</span>
        </a>
        <div>
          <p data-product-detail-status>Ürün detayı</p>
          <h1 data-product-detail-title>Ürün yükleniyor</h1>
          <span data-product-detail-summary>Fiyat, stok, medya, açıklama ve onay bilgileri.</span>
        </div>
        <div class="partner-products-actions">
          <button type="button" data-refresh-product-detail><i class="fa-solid fa-rotate"></i><span>Yenile</span></button>
          <button type="button" data-publish-product-detail hidden><i class="fa-solid fa-bullhorn"></i><span>Yayına Al</span></button>
          <button type="button" class="is-danger" data-archive-product-detail><i class="fa-solid fa-box-archive"></i><span>Sil</span></button>
        </div>
      </header>

      <div class="partner-products-alert" data-product-detail-alert hidden></div>
      <section class="partner-product-detail-revision-panel" data-product-detail-revision-panel hidden></section>

      <section class="partner-product-detail-layout">
        <aside class="partner-product-detail-side">
          <div class="partner-product-detail-preview" data-product-detail-preview>
            <div class="partner-products-loading">Ürün bilgileri hazırlanıyor.</div>
          </div>
          <div data-product-detail-variants></div>
        </aside>

        <form class="partner-product-edit-form partner-product-detail-form" data-product-detail-form data-product-form>
          <input type="hidden" name="id">
          <div class="partner-product-edit-grid">
            <label class="partner-product-span-2"><span>Ürün adı</span><input name="name" required maxlength="180"></label>
            <label><span>SKU</span><input name="sku" maxlength="90"></label>
            <label><span>Barkod / GTIN</span><input name="barcode" maxlength="80"></label>
            <label><span>Yayın kanalı</span><select name="catalog_scope"><option value="shop">Allona Shop</option><option value="market">Allona Market</option><option value="food">Allona Yemek</option><option value="service">Hizmet</option><option value="taxi">Taksi</option></select></label>
            <label><span>Kategori</span><input name="category" maxlength="120" list="shop-category-options"></label>
            <label><span>Marka / Restoran</span><input name="brand" maxlength="140"></label>
            <label><span>Fiyat</span><input name="price" type="number" min="0" step="0.01" required></label>
            <label><span>Stok</span><input name="stock" type="number" min="0" step="1" required></label>
            <input name="media_gallery" type="hidden" data-product-media-gallery>
            <label class="partner-product-span-2"><span>Görsel dosyaları (en fazla 8)</span><input name="image_file" type="file" accept="image/avif,image/jpeg,image/png,image/webp" multiple data-product-image-file></label>
            <label class="partner-product-span-2"><span>Görsel URL</span><input name="image_url" maxlength="900" data-product-image-url></label>
            <label class="partner-product-span-2"><span>Video dosyası (en fazla 1)</span><input name="video_file" type="file" accept="video/mp4,video/webm,video/quicktime" data-product-video-file></label>
            <label class="partner-product-span-2"><span>Video URL</span><input name="video_url" maxlength="1200" data-product-video-url></label>
            <label class="partner-product-span-2"><span>Açıklama</span><textarea name="description" maxlength="1800"></textarea></label>
            <label><span>Satıcı görünen adı</span><input name="seller_public_name" maxlength="140"></label>
            <label><span>Satıcı şehir</span><input name="seller_city" maxlength="90"></label>
            <label class="partner-product-span-2"><span>Ticari unvan</span><input name="seller_legal_name" maxlength="180"></label>
            <label><span>Destek iletişimi</span><input name="seller_contact" maxlength="180"></label>
            <label><span>Vergi no maskesi</span><input name="seller_tax_number_masked" maxlength="40"></label>
            <label class="partner-product-span-2"><span>Fatura sorumluluğu</span><input name="invoice_responsibility" maxlength="320"></label>
            <label class="partner-product-span-2"><span>Satıcı bilgilendirme</span><input name="seller_disclosure" maxlength="420"></label>
            <label class="partner-product-span-2"><span>SEO başlığı</span><input name="meta_title" maxlength="180"></label>
            <label class="partner-product-span-2"><span>SEO açıklaması</span><textarea name="meta_description" maxlength="300"></textarea></label>
          </div>
          <footer>
            <a href="/pages/partner/partner-products.html"><i class="fa-solid fa-table-list"></i><span>Listeye Dön</span></a>
            <button type="submit"><i class="fa-solid fa-paper-plane"></i><span>Kaydet ve Onaya Gönder</span></button>
          </footer>
        </form>
      </section>
    </main>

    <div data-layout="footer"></div>
    <datalist id="shop-category-options">
      <option value="Kadın"></option>
      <option value="Erkek"></option>
      <option value="Elektronik"></option>
      <option value="Ayakkabı & Çanta"></option>
      <option value="Moda"></option>
      <option value="Ev & Yaşam"></option>
      <option value="Oto, Bahçe & Yapı Market"></option>
      <option value="Anne & Çocuk"></option>
      <option value="Spor & Outdoor"></option>
      <option value="Kozmetik"></option>
      <option value="Süpermarket"></option>
      <option value="Kitap & Hobi"></option>
      <option value="Saat & Aksesuar"></option>
      <option value="Beyaz Eşya"></option>
      <option value="Bilgisayar & Tablet"></option>
      <option value="Telefon & Aksesuar"></option>
    </datalist>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../../js/config.js?v=20260620-partneros1" defer></script>
  <script src="../../js/core.js?v=20260630-shopcat2" defer></script>
  <script src="../../js/supabase-client.js?v=20260629-partnerhost1" defer></script>
  <script src="../../js/auth.js?v=20260629-partnerhost1" defer></script>
  <script src="../../js/layout.v3.js?v=20260628-modules1" defer></script>
  <script src="../../js/product-image-upload.js?v=20260630-media2" defer></script>
  <script src="../../js/partner-product-detail.js?v=20260701-detailfix1" defer></script>
  <script src="../../js/platform.js?v=20260712-theme-text1" defer></script>
  <script src="../../js/privacy-consent.js?v=20260712-theme-text1" defer></script>
</body>
</html>
