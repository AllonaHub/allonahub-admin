<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Siparişleri | AllonaHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{min-width:1320px;background:#020814;color:white}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at top left,#00b7ff55,transparent 35%),radial-gradient(circle at bottom right,#ffd70033,transparent 30%),linear-gradient(135deg,#020814,#061b33,#002b4d)}
.wrapper{width:1320px;margin:auto;padding:30px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:38px;color:#ffd700}
.back{color:white;text-decoration:none;font-weight:900}
.card{background:rgba(5,25,50,.92);border:1px solid rgba(0,229,255,.28);border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 0 25px rgba(0,229,255,.12)}
.top{display:flex;justify-content:space-between;gap:20px;margin-bottom:12px}
.order-no{color:#ffd700;font-weight:900;font-size:20px}
.status{color:#00e5ff;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0;color:#dcefff}
.items{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.item{display:flex;justify-content:space-between;margin:8px 0;color:#ffffffcc}
button,select{padding:12px 18px;border:none;border-radius:14px;font-weight:900}
select{background:#031326;color:white;border:1px solid rgba(0,229,255,.32)}
button{cursor:pointer}
.approve{background:linear-gradient(135deg,#00e5ff,#0077ff);color:white}
.disabled{background:#ffffff22;color:#ffffff88;cursor:not-allowed}
.notice{position:fixed;right:25px;bottom:25px;background:#031326;border:1px solid #00e5ff88;border-radius:18px;padding:15px 18px;display:none}
</style>
  <link rel="stylesheet" href="../../css/platform.css?v=20260626-mobile-std16">
</head>

<body>
<div class="wrapper">

  <div class="header">
    <h1>Partner Siparişleri</h1>
    <a class="back" href="partner-panel.html">Panele Dön</a>
  </div>

  <div id="orders">Siparişler yükleniyor...</div>

</div>

<div id="notice" class="notice"></div>

<script>
const SUPABASE_URL = "https://xqvikrysciguzholdjeb.supabase.co";
const SUPABASE_KEY = "sb_publishable_-P8KULtNFK5D9XRAeJrdng_zTCZ8zdF";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showNotice(msg){
  const n=document.getElementById("notice");
  n.textContent=String(msg || "");
  n.style.display="block";
  setTimeout(()=>n.style.display="none",3500);
}

function safe(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function requirePartner(){
  const {data:{user}}=await supabaseClient.auth.getUser();
  if(!user){
    window.location.href="partner.html";
    return false;
  }
  const {data:profile,error}=await supabaseClient
    .from("profiles")
    .select("role")
    .eq("id",user.id)
    .maybeSingle();
  if(error || !profile || !["partner","admin","super_admin"].includes(profile.role)){
    document.getElementById("orders").textContent="Bu alana erişim yetkiniz yok.";
    return false;
  }
  return true;
}

async function loadOrders(){
  const {data,error}=await supabaseClient
    .from("orders")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    document.getElementById("orders").innerHTML="Siparişler yüklenemedi.";
    console.error(error);
    return;
  }

  let itemQuery=supabaseClient
    .from("order_items")
    .select("*");
  const partnerId=localStorage.getItem("allonaPartnerId") || "";
  if(partnerId){
    itemQuery=itemQuery.eq("partner_id",partnerId);
  }
  const {data:items,error:itemsError}=await itemQuery;

  if(itemsError){
    document.getElementById("orders").innerHTML="Sipariş ürünleri yüklenemedi.";
    console.error(itemsError);
    return;
  }

  const partnerOrderIds=[...new Set((items||[]).map(i=>i.order_id))];
  const partnerOrders=(data||[]).filter(o=>partnerOrderIds.includes(o.id));

  if(!partnerOrders.length){
    document.getElementById("orders").innerHTML="Bu partnere ait sipariş bulunmuyor.";
    return;
  }

  document.getElementById("orders").innerHTML=partnerOrders.map(order=>{
    const orderItems=items.filter(i=>i.order_id===order.id);
    const partnerState=order.partner_status || order.status || order.order_status || "pending";
    const allowedStatuses=["preparing","shipped","delivered"];

    return `
      <div class="card">
        <div class="top">
          <div>
            <div class="order-no"><a class="back" href="partner-order-detail.html?id=${safe(order.id)}">${safe(order.order_number || order.order_no)}</a></div>
            <div>${safe(order.customer_name)} • ${safe(order.customer_phone)}</div>
          </div>
          <div class="status">${safe(statusText(partnerState))}</div>
        </div>

        <div class="grid">
          <div><b>Şehir:</b> ${safe(order.city || "-")}</div>
          <div><b>Brüt:</b> ${Number(order.grand_total || order.total || 0).toLocaleString("tr-TR")} ₺</div>
          <div><b>Ödeme:</b> ${safe(order.payment_status || "pending")}</div>
        </div>

        <div><b>Adres:</b> ${safe(order.address || "-")}</div>

        <div class="items">
          ${orderItems.map(item=>`
            <div class="item">
              <span>${safe(item.product_name)}</span>
              <span>${item.quantity} adet • Brüt ${Number(item.total_price || (item.price * item.quantity) || 0).toLocaleString("tr-TR")} ₺ • Komisyon ${Number(item.platform_commission || 0).toLocaleString("tr-TR")} ₺ • Net ${Number(item.partner_net_earning || item.total_price || 0).toLocaleString("tr-TR")} ₺</span>
            </div>
          `).join("")}
        </div>

        <br>

        <select aria-label="Sipariş durumu" onchange="updatePartnerStatus('${order.id}',this.value)">
          ${allowedStatuses.map(status=>`<option value="${status}" ${partnerState===status ? "selected" : ""}>${safe(statusText(status))}</option>`).join("")}
        </select>
      </div>
    `;
  }).join("");
}

function statusText(status){
  const map={
    new:"Yeni Sipariş",
    pending:"Yeni Sipariş",
    approved:"Hazırlanıyor",
    preparing:"Hazırlanıyor",
    shipped:"Kargoya Verildi",
    delivered:"Teslim Edildi",
    cancelled:"İptal"
  };
  return map[status] || status || "Yeni";
}

async function updatePartnerStatus(orderId,status){
  if(!/^[0-9a-f-]{36}$/i.test(String(orderId))){
    showNotice("Sipariş kimliği geçersiz.");
    return;
  }
  const allowed=["preparing","shipped","delivered"];
  if(!allowed.includes(status)){
    showNotice("Partner sadece hazırlanıyor, kargoda veya teslim edildi durumlarını seçebilir.");
    return;
  }
  const payload={
    partner_status:status,
    order_status:status,
    status:status
  };
  const {error}=await supabaseClient
    .from("orders")
    .update(payload)
    .eq("id",orderId);

  if(error){
    console.error(error);
    showNotice("Sipariş güncellenemedi.");
    return;
  }

  showNotice("Sipariş durumu güncellendi.");
  loadOrders();
}

requirePartner().then(ok=>{
  if(ok) loadOrders();
});
</script>
  <div data-layout="footer"></div>
  <script src="../../js/core.js?v=20260623-locnav1" defer></script>
  <script src="../../js/layout.v3.js?v=20260626-mobile-std16" defer></script>
  <script src="../../js/platform.js?v=20260626-mobile-std16" defer></script>
</body>
</html>
