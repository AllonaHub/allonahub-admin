<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partner Panel | AllonaHub</title>
  <meta name="description" content="AllonaHub partner paneli.">
  <link rel="stylesheet" href="../../css/styles.v2.css?v=20260620-mobile2">
  <link rel="stylesheet" href="../../css/platform.css?v=20260620-mobile2">
</head>
<body>
  <div class="site-shell" data-page="partner">
    <div data-layout="header"></div>
    <main class="site-main">
      <section class="container page-heading">
        <div>
          <p class="eyebrow">Partner</p>
          <h1>Partner Panel</h1>
          <p>Ürün, stok, sipariş ve rapor görünümü.</p>
        </div>
      </section>

      <section class="container admin-layout" data-partner-shell>
        <nav class="side-menu" aria-label="Partner menüsü">
          <a href="#products">Ürünlerim</a>
          <a href="#orders">Siparişler</a>
          <a href="#reports">Raporlar</a>
        </nav>

        <div>
          <section class="panel" id="products">
            <div class="section-header">
              <div>
                <p class="eyebrow">Ürün</p>
                <h2>Ürünlerim</h2>
              </div>
            </div>
            <div data-partner-products></div>
          </section>

          <section class="panel section" id="orders">
            <div class="section-header">
              <div>
                <p class="eyebrow">Sipariş</p>
                <h2>Siparişler</h2>
              </div>
            </div>
            <div data-partner-orders></div>
          </section>

          <section class="panel section" id="reports">
            <div class="section-header">
              <div>
                <p class="eyebrow">Rapor</p>
                <h2>Performans</h2>
              </div>
            </div>
            <div class="data-card">
              <div class="summary-line"><span>Toplam ürün</span><strong data-report-products>-</strong></div>
              <div class="summary-line"><span>Bekleyen sipariş</span><strong data-report-orders>-</strong></div>
              <div class="summary-line"><span>Ödeme bekleyen</span><strong data-report-payments>-</strong></div>
            </div>
          </section>
        </div>
      </section>
    </main>
    <div data-layout="footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../../js/config.js?v=20260619-live5" defer></script>
  <script src="../../js/core.js?v=20260619-sec1" defer></script>
  <script src="../../js/supabase-client.js?v=20260619-sec1" defer></script>
  <script src="../../js/auth.js?v=20260620-account1" defer></script>
  <script src="../../js/cart.js?v=20260619-live9" defer></script>
  <script src="../../js/layout.v3.js?v=20260620-mobile2" defer></script>
  <script src="../../js/partner.js?v=20260619-sec1" defer></script>
  <script src="../../js/platform.js?v=20260620-mobile1" defer></script>
</body>
</html>
