<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sipariş Sonucu | AllonaHub</title>
  <meta name="description" content="AllonaHub sipariş ve iyzico ödeme sonucu.">
  <link rel="stylesheet" href="../../css/styles.v2.css?v=20260621-checkout-contrast1">
  <link rel="stylesheet" href="../../css/platform.css?v=20260622-corp1">
</head>
<body>
  <div class="site-shell" data-page="order-success">
    <div data-layout="header"></div>
    <main class="site-main">
      <section class="container page-heading">
        <div>
          <p class="eyebrow">Sipariş</p>
          <h1 data-order-result-title>Sipariş Sonucu</h1>
          <p data-order-result-copy>Ödeme sonucunuz kontrol ediliyor.</p>
        </div>
      </section>

      <section class="container checkout-grid">
        <article class="panel payment-result" data-order-result>
          <div class="payment-result__icon" data-order-result-icon aria-hidden="true"></div>
          <h2 data-order-result-heading>İşlem durumu</h2>
          <p data-order-result-message>iyzico dönüşüyle sipariş durumunuz güncellendi.</p>
          <div class="payment-handoff__meta" data-order-result-meta></div>
          <div class="form-actions">
            <a class="btn" href="../account/orders.html">Siparişlerime Git</a>
            <a class="btn btn--light" href="shop.html">Mağazaya Dön</a>
            <a class="btn btn--light hidden" href="checkout.html" data-payment-retry>Ödemeyi Tekrar Dene</a>
          </div>
        </article>
        <aside class="summary-card">
          <h2>Ödeme Güvencesi</h2>
          <div class="summary-line"><span>Kart verisi</span><strong>AllonaHub'da tutulmaz</strong></div>
          <div class="summary-line"><span>Doğrulama</span><strong>iyzico token</strong></div>
          <div class="summary-line"><span>Takip</span><strong>Hesabım & Siparişlerim</strong></div>
        </aside>
      </section>
    </main>
    <div data-layout="footer"></div>
  </div>

  <script src="../../js/config.js?v=20260619-live5" defer></script>
  <script src="../../js/core.js?v=20260621-iyzico1" defer></script>
  <script src="../../js/layout.v3.js?v=20260620-mobile2" defer></script>
  <script src="../../js/order-success-page.js?v=20260621-iyzico1" defer></script>
  <script src="../../js/platform.js?v=20260622-corp1" defer></script>
</body>
</html>
