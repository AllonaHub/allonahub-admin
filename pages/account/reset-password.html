<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<title>AllonaHub Şifre Yenileme</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>
<script src="../../js/config.js?v=20260627-config-central"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
:root{--blue:#0077ff;--neon:#00d5ff;--deep:#0a2540;--muted:#6b7b8f;--line:rgba(0,150,255,.22)}
body{min-width:0;background:linear-gradient(135deg,#fff,#f4fbff,#fff);color:#102033;overflow-x:hidden}
.page{width:min(1320px,100%);margin:0 auto;padding:80px 22px}
.box{width:min(560px,100%);margin:0 auto;padding:38px;border-radius:28px;background:white;border:1px solid var(--line);box-shadow:0 0 28px rgba(0,213,255,.15);text-align:center}
h1{color:var(--deep);font-size:38px;margin-bottom:12px}
p{color:var(--muted);line-height:1.6;margin-bottom:24px}
.input{height:56px;border-radius:17px;background:#f7fcff;border:1px solid rgba(0,150,255,.22);padding:0 16px;margin-bottom:14px}
.input input{width:100%;height:100%;background:transparent;border:0;outline:0;font-size:15px;color:#102033}
.btn{width:100%;height:56px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--neon),var(--blue));color:white;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 0 24px rgba(0,213,255,.36)}
.btn:disabled{opacity:.62;cursor:not-allowed}
.reset-status{margin:-6px 0 18px;padding:12px 14px;border-radius:16px;background:#effaf6;border:1px solid rgba(0,160,100,.2);color:#10624a;font-size:14px;font-weight:800;line-height:1.45;text-align:left}
.reset-status.error{background:#fff5f5;border-color:rgba(220,40,40,.24);color:#9b1c1c}
.reset-status.success{background:#effaf6;border-color:rgba(0,160,100,.2);color:#10624a}
a{display:block;margin-top:18px;color:var(--blue);font-weight:900;text-decoration:none}
body.auth-reset-page .box h1{color:#0a2540!important;-webkit-text-fill-color:#0a2540!important}
html body[data-theme].auth-reset-page .page .box>p,
body.auth-reset-page .page .box>p{color:#52657a!important;-webkit-text-fill-color:#52657a!important;text-shadow:none!important}
body.auth-reset-page .input input{color:#102033!important;-webkit-text-fill-color:#102033!important}
body.auth-reset-page .input input::placeholder{color:#6b7b8f!important;opacity:1}
body.auth-reset-page .password-visibility-toggle{color:#31516b!important}
@media(max-width:640px){
  .page{padding:42px 14px}
  .box{padding:28px 18px;border-radius:22px}
  h1{font-size:clamp(2rem,9vw,2.5rem)}
}
</style>
  <link rel="stylesheet" href="../../css/platform.css?v=20260828-corporate4">
  <link rel="stylesheet" href="../../css/password-visibility.css?v=20260920-auth2">
</head>

<body class="auth-reset-page">
<div class="page">
  <div class="box">
    <h1>Şifre Yenile</h1>
    <p>Yeni şifreni oluştur. Şifre en az 8 karakter olmalıdır.</p>
    <div id="resetStatus" class="reset-status">Şifre yenileme bağlantısı doğrulanıyor...</div>

    <div class="input">
      <input id="newPassword" type="password" placeholder="Yeni şifre" autocomplete="new-password">
    </div>

    <div class="input">
      <input id="newPassword2" type="password" placeholder="Yeni şifre tekrar" autocomplete="new-password">
    </div>

    <button id="resetButton" class="btn" onclick="updatePassword()" disabled>Şifreyi Güncelle</button>

    <a id="resetReturnLink" href="user.html?tab=login">Giriş Sayfasına Dön</a>
  </div>
</div>

<script>
const SUPABASE_URL=window.Allona?.config?.supabaseUrl || "";
const SUPABASE_KEY=window.Allona?.config?.supabaseAnonKey || "";
const API_BASE=String(window.Allona?.config?.apiBase || "").replace(/\/$/,"");
const INITIAL_RECOVERY_SEARCH=window.location.search || "";
const INITIAL_RECOVERY_HASH=window.location.hash || "";
const OAUTH_RETURN_TO_KEY="allonahub.oauth.returnTo";
const PARTNER_PORTAL_HOST="partner.allonahub.com";
const TRUSTED_OAUTH_RETURN_ORIGINS=[
  "https://allonahub.com",
  "https://www.allonahub.com",
  "https://partner.allonahub.com"
];
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true
  }
});

const LOGIN_URL=new URL("/pages/account/user.html?tab=login",window.location.origin).href;
let recoveryReady=false;
let recoveryPromise=null;

function setStatus(message,type){
  const status=document.getElementById("resetStatus");
  if(!status)return;
  status.textContent=message || "";
  status.className="reset-status";
  if(type)status.classList.add(type);
  status.hidden=!message;
}

function collectRecoveryParams(){
  const params=new URLSearchParams(window.location.search || INITIAL_RECOVERY_SEARCH);
  const rawHash=String(window.location.hash || INITIAL_RECOVERY_HASH || "").replace(/^#/,"");
  if(rawHash){
    const normalizedHash=rawHash.charAt(0)==="?" ? rawHash.slice(1) : rawHash;
    const hashParams=new URLSearchParams(normalizedHash);
    hashParams.forEach((value,key)=>params.set(key,value));
  }
  return params;
}

function hasRecoveryIntent(params){
  const type=String(params && params.get("type") || "").toLowerCase();
  return type==="recovery" || type==="password_recovery";
}

function hasForcedPasswordIntent(params){
  return String(params && params.get("forced") || "")==="1";
}

function hasOAuthReturnParams(params){
  if(!params)return false;
  return ["code","access_token","refresh_token","provider_token","provider_refresh_token","error","error_code"].some(key=>params.has(key));
}

function storedOAuthReturnUrl(){
  let stored="";
  try{
    stored=sessionStorage.getItem(OAUTH_RETURN_TO_KEY) || "";
  }catch(error){}
  if(!stored)return "";

  try{
    const target=new URL(stored,window.location.origin);
    if(target.origin!==window.location.origin && !TRUSTED_OAUTH_RETURN_ORIGINS.includes(target.origin))return "";
    if(/\/pages\/account\/reset-password\.html$/i.test(target.pathname))return "";
    return target.href;
  }catch(error){
    return "";
  }
}

function resetReturnUrl(updated=false){
  const params=collectRecoveryParams();
  const rawReturnTo=String(params.get("returnTo") || "").trim();
  let target=null;

  if(rawReturnTo.toLowerCase()==="partner"){
    target=new URL("/pages/partner/partner.html",window.location.origin);
  }else if(rawReturnTo){
    try{
      target=new URL(rawReturnTo,window.location.origin);
    }catch(error){
      target=null;
    }
  }

  const trusted=target && (target.origin===window.location.origin || TRUSTED_OAUTH_RETURN_ORIGINS.includes(target.origin));
  const partnerTarget=trusted && (
    /\/pages\/partner\/partner\.html$/i.test(target.pathname) ||
    (target.hostname===PARTNER_PORTAL_HOST && (target.pathname==="/" || target.pathname==="/login"))
  );
  const userTarget=trusted && /\/pages\/account\/user\.html$/i.test(target.pathname);

  if(!partnerTarget && !userTarget){
    target=new URL(LOGIN_URL);
  }

  if(!partnerTarget){
    target.searchParams.set("tab","login");
  }

  if(updated){
    target.searchParams.set("password","updated");
  }

  return target.href;
}

function updateResetReturnLink(){
  const link=document.getElementById("resetReturnLink");
  if(!link)return;
  const href=resetReturnUrl(false);
  link.href=href;
  try{
    const target=new URL(href);
    const partnerTarget=/\/pages\/partner\/partner\.html$/i.test(target.pathname) || target.hostname===PARTNER_PORTAL_HOST;
    link.textContent=partnerTarget ? "Partner Girişine Dön" : "Giriş Sayfasına Dön";
  }catch(error){}
}

function redirectNonRecoveryOAuth(params){
  if(hasRecoveryIntent(params) || !hasOAuthReturnParams(params))return false;
  const stored=storedOAuthReturnUrl();
  if(!stored)return false;

  const target=new URL(stored);
  const currentSearch=new URLSearchParams(window.location.search || INITIAL_RECOVERY_SEARCH);
  currentSearch.forEach((value,key)=>target.searchParams.set(key,value));
  const rawHash=window.location.hash || INITIAL_RECOVERY_HASH || "";
  if(rawHash)target.hash=rawHash;

  try{
    sessionStorage.removeItem(OAUTH_RETURN_TO_KEY);
  }catch(error){}
  window.location.replace(target.href);
  return true;
}

function cleanRecoveryUrl(){
  if(window.history && window.history.replaceState){
    window.history.replaceState({},document.title,window.location.pathname);
  }
}

function markRecoveryReady(){
  recoveryReady=true;
  const button=document.getElementById("resetButton");
  if(button)button.disabled=false;
  setStatus("Şifre yenileme bağlantısı doğrulandı. Yeni şifreni girebilirsin.","success");
}

async function prepareRecoverySession(){
  if(recoveryReady)return true;
  if(recoveryPromise)return recoveryPromise;

  recoveryPromise=(async()=>{
    const params=collectRecoveryParams();
    const recoveryIntent=hasRecoveryIntent(params);
    const forcedIntent=hasForcedPasswordIntent(params);
    if(redirectNonRecoveryOAuth(params))return false;

    const linkError=params.get("error_description") || params.get("error") || params.get("error_code");
    if(linkError){
      setStatus("Şifre yenileme bağlantısı doğrulanamadı veya süresi doldu. Lütfen giriş sayfasındaki Şifremi Unuttum alanından yeni bağlantı iste.","error");
      return false;
    }

    if(!recoveryIntent && !forcedIntent){
      setStatus("Şifre yenilemek için bu sayfayı e-postana gelen bağlantıdan açmalısın.","error");
      return false;
    }

    if(forcedIntent){
      const existing=await supabaseClient.auth.getSession();
      if(existing?.data?.session){
        markRecoveryReady();
        setStatus("Geçici giriş tamamlandı. Devam etmek için yalnızca sizin bildiğiniz yeni şifreyi oluşturun.","success");
        return true;
      }
      setStatus("Geçici oturum bulunamadı. Giriş sayfasından yeniden giriş yapın.","error");
      return false;
    }

    try{
      const existing=await supabaseClient.auth.getSession();
      if(existing && existing.data && existing.data.session){
        markRecoveryReady();
        return true;
      }
    }catch(error){}

    const accessToken=params.get("access_token");
    const refreshToken=params.get("refresh_token");
    const code=params.get("code");
    const tokenHash=params.get("token_hash");
    const rawType=params.get("type") || "recovery";
    const otpType=["recovery","email","signup","magiclink","email_change"].includes(rawType) ? rawType : "recovery";

    try{
      if(accessToken && refreshToken){
        const { error }=await supabaseClient.auth.setSession({
          access_token:accessToken,
          refresh_token:refreshToken
        });
        if(error)throw error;
        cleanRecoveryUrl();
        markRecoveryReady();
        return true;
      }

      if(code){
        const { error }=await supabaseClient.auth.exchangeCodeForSession(code);
        if(error)throw error;
        cleanRecoveryUrl();
        markRecoveryReady();
        return true;
      }

      if(tokenHash){
        const { data,error }=await supabaseClient.auth.verifyOtp({
          token_hash:tokenHash,
          type:otpType
        });
        if(error)throw error;
        if(data && data.session && data.session.access_token && data.session.refresh_token){
          await supabaseClient.auth.setSession({
            access_token:data.session.access_token,
            refresh_token:data.session.refresh_token
          });
        }
        cleanRecoveryUrl();
        markRecoveryReady();
        return true;
      }
    }catch(error){
      setStatus("Şifre yenileme bağlantısı doğrulanamadı veya süresi doldu. Lütfen giriş sayfasındaki Şifremi Unuttum alanından yeni bağlantı iste.","error");
      return false;
    }

    setStatus("Şifre yenilemek için bu sayfayı e-postana gelen bağlantıdan açmalısın.","error");
    return false;
  })();

  try{
    return await recoveryPromise;
  }finally{
    recoveryPromise=null;
  }
}

supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY" || session && hasRecoveryIntent(collectRecoveryParams())){
    markRecoveryReady();
  }
});

function safeResetAlert(message){
  const text=message || "Şifre güncelleme güvenli şekilde tamamlanamadı. Lütfen bağlantıyı tekrar deneyin.";
  setStatus(text,"error");
  alert(text);
}

function passwordUpdateMessage(error){
  const message=String(error && error.message || "").toLowerCase();
  const code=String(error && error.code || "").toLowerCase();
  const status=Number(error && error.status || 0);
  if(message.includes("same") || message.includes("different from") || code.includes("same_password")) return "Yeni şifren önceki şifrenden farklı olmalıdır.";
  if(message.includes("weak") || message.includes("characters") || code.includes("weak_password")) return "Yeni şifren en az 8 karakter olmalıdır. Daha güçlü bir şifre seçip tekrar dene.";
  if(message.includes("session") || message.includes("jwt") || message.includes("expired") || code.includes("session")) return "Şifre yenileme bağlantısının süresi dolmuş. Giriş sayfasından yeni bağlantı iste.";
  if(status===429 || message.includes("rate") || message.includes("too many")) return "Kısa sürede çok fazla deneme yapıldı. Birkaç dakika bekleyip tekrar dene.";
  if(message.includes("network") || message.includes("fetch")) return "Bağlantı kurulamadı. İnternet bağlantını kontrol edip tekrar dene.";
  return "Şifre şu anda güncellenemedi. Yeni bağlantı istemeden önce bir kez daha dene.";
}

async function updatePassword(){
  const p1=document.getElementById("newPassword").value;
  const p2=document.getElementById("newPassword2").value;
  const button=document.getElementById("resetButton");

  if(!p1 || !p2){
    alert("Lütfen iki şifre alanını da doldur.");
    return;
  }

  if(p1.length<8){
    alert("Şifre en az 8 karakter olmalıdır.");
    return;
  }

  if(p1!==p2){
    alert("Şifreler aynı değil.");
    return;
  }

  try{
    if(button)button.disabled=true;
    const isReady=await prepareRecoverySession();
    if(!isReady){
      safeResetAlert("Şifre yenileme oturumu kurulamadı. Lütfen giriş sayfasındaki Şifremi Unuttum alanından yeni bağlantı iste.");
      return;
    }

    const params=collectRecoveryParams();
    let error=null;
    let replacementSession=null;
    if(hasForcedPasswordIntent(params)){
      const sessionResult=await supabaseClient.auth.getSession();
      const accessToken=sessionResult?.data?.session?.access_token || "";
      if(!accessToken){
        error=new Error("Geçici oturum bulunamadı. Yeniden giriş yapın.");
      }else{
        const response=await fetch(`${API_BASE}/v1/auth/complete-temporary-password`,{
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            Authorization:`Bearer ${accessToken}`
          },
          body:JSON.stringify({password:p1})
        });
        const result=await response.json().catch(()=>({}));
        if(!response.ok || !result.ok){
          error=new Error(result.message || "Yeni şifre kaydedilemedi.");
        }else{
          replacementSession=result.session || null;
          if(replacementSession?.access_token && replacementSession?.refresh_token){
            const applied=await supabaseClient.auth.setSession({
              access_token:replacementSession.access_token,
              refresh_token:replacementSession.refresh_token
            });
            if(applied.error)error=applied.error;
          }else{
            try{await supabaseClient.auth.refreshSession();}catch(refreshError){}
          }
        }
      }
    }else{
      const updateResult=await supabaseClient.auth.updateUser({
        password:p1,
        data:{must_change_password:false,password_changed_at:new Date().toISOString()}
      });
      error=updateResult.error;
    }

    if(error){
      safeResetAlert(passwordUpdateMessage(error));
      return;
    }

    recoveryReady=false;
    setStatus("Şifren başarıyla güncellendi. Açık oturumun korunarak hesabına yönlendiriliyorsun.","success");
    window.setTimeout(()=>window.location.replace(resetReturnUrl(true)),700);
  }catch(error){
    safeResetAlert();
  }finally{
    if(button)button.disabled=!recoveryReady;
  }
}

document.addEventListener("DOMContentLoaded",()=>{
  updateResetReturnLink();
  prepareRecoverySession();
});
</script>
