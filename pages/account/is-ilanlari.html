<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesleğime Uygun İşler | AllonaHub</title>
  <meta name="description" content="AllonaHub meslek ve sektör bazlı iş ilanı eşleşme merkezi.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../css/styles.v2.css?v=20260628-modules1">
  <link rel="stylesheet" href="../../css/platform.css?v=20260626-mobile-std34">
  <style>
    .jobs-page{display:grid;gap:18px;padding-bottom:42px}
    .job-filter-line{padding:16px;border-radius:8px;background:rgba(0,181,255,.1);border:1px solid rgba(0,181,255,.18);color:#d7f4ff;line-height:1.55}
    .job-grid{display:grid;gap:12px}
    .job-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
    .job-row i{width:42px;height:42px;display:grid;place-items:center;border-radius:8px;background:rgba(0,181,255,.15);color:#00d5ff}
    .job-row h3{margin:0 0 4px}
    .job-row p{margin:0;color:var(--muted);line-height:1.5}
    .job-row small{color:#9fc6d6;text-align:right}
    @media(max-width:720px){.job-row{grid-template-columns:42px minmax(0,1fr)}.job-row small{grid-column:2;text-align:left}}
  </style>
</head>
<body>
  <div class="site-shell">
    <div data-layout="header"></div>
    <main class="site-main">
      <div class="container platform-page jobs-page">
        <section class="platform-hero">
          <p class="platform-eyebrow">Hesabım</p>
          <h1>Mesleğime Uygun İşler</h1>
          <p>İlanlar sektör, meslek ve pozisyon anahtarına göre filtrelenir. Kullanıcı yalnızca kendi mesleğine uygun iş bildirimlerini görür.</p>
        </section>
        <div class="job-filter-line" data-job-match-copy>Profil bilgilerine göre ilan eşleşmesi hazırlanıyor.</div>
        <section class="platform-section">
          <h2>Uygun İlan Akışı</h2>
          <div class="job-grid" data-job-list></div>
        </section>
        <div class="platform-actions">
          <a class="platform-action" href="user-panel.html">Hesabıma Dön</a>
          <a class="platform-action platform-action--secondary" href="profil.html">Mesleğimi Düzenle</a>
        </div>
      </div>
    </main>
    <div data-layout="footer"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../../js/config.js?v=20260627-config-central" defer></script>
  <script src="../../js/core.js?v=20260630-currency1" defer></script>
  <script src="../../js/supabase-client.js?v=20260621-tx1" defer></script>
  <script src="../../js/auth.js?v=20260620-auth2" defer></script>
  <script src="../../js/user-profile-sync.js?v=20260629-panel-fix2" defer></script>
  <script src="../../js/layout.v3.js?v=20260628-modules1" defer></script>
  <script src="../../js/platform.js?v=20260630-currency1" defer></script>
  <script src="../../js/privacy-consent.js?v=20260628-privacy1" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const sync = window.AllonaProfileSync;
      const client = sync && sync.createClient ? sync.createClient() : null;
      const esc = (value) => window.Allona?.core?.escapeHTML ? window.Allona.core.escapeHTML(value || "") : String(value || "");
      const list = document.querySelector("[data-job-list]");
      const copy = document.querySelector("[data-job-match-copy]");
      if (!sync || !client || !list) return;
      const loaded = await sync.load(client);
      if (!loaded || !loaded.user) {
        window.location.href = "user.html";
        return;
      }
      const profile = loaded.profile || {};
      const sector = profile.sector_key || "general";
      const profession = profile.profession_key || "other_profession";
      const professionName = profile.profession_name || "Meslek seçilmedi";
      const sampleJobs = [
        { sector_key: "maritime", profession_key: "bosun", title: "Bosun / Reis", company: "Allona Denizcilik Partneri", location: "Global filo", source: "Gemi işleri" },
        { sector_key: "maritime", profession_key: "able_seaman", title: "Able Seaman / Usta Gemici", company: "Allona Denizcilik Partneri", location: "Deck crew", source: "Gemi işleri" },
        { sector_key: "maritime", profession_key: "second_officer", title: "Second Officer / 2. Zabit", company: "Allona Denizcilik Partneri", location: "Bridge team", source: "Gemi işleri" },
        { sector_key: "technology", profession_key: "software_developer", title: "Yazılım Geliştirici", company: "Allona teknoloji partneri", location: "Uzaktan", source: "Kariyer" },
        { sector_key: "health", profession_key: "nurse", title: "Hemşire", company: "Allona sağlık partneri", location: "İstanbul", source: "Sağlık" }
      ];
      const matches = sampleJobs.filter((job) => job.sector_key === sector && job.profession_key === profession);
      if (copy) {
        copy.textContent = `${professionName} profili için ${matches.length} uygun ilan gösteriliyor. Farklı seviyedeki ya da başka pozisyondaki ilanlar bu kullanıcıya açılmaz.`;
      }
      list.innerHTML = matches.length ? matches.map((job) => `
        <article class="job-row">
          <i class="fa-solid ${job.sector_key === "maritime" ? "fa-ship" : "fa-briefcase"}"></i>
          <span>
            <h3>${esc(job.title)}</h3>
            <p>${esc(job.company)} · ${esc(job.location)}</p>
          </span>
          <small>${esc(job.source)}<br>Başvuru altyapısı hazırlanıyor</small>
        </article>
      `).join("") : `<div class="empty-state">Şu an ${esc(professionName)} için aktif ilan yok. Yeni uygun ilanlar bildirimlerine düşecek.</div>`;
    });
  </script>
</body>
</html>
