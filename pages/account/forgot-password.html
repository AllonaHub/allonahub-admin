<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Şifre Sıfırla | AllonaHub</title>
  <link rel="canonical" href="user.html?tab=forgot">
  <meta http-equiv="refresh" content="0; url=user.html?tab=forgot">
  <script>
    (function(){
      const target=new URL("user.html", window.location.href);
      new URLSearchParams(window.location.search).forEach((value,key)=>target.searchParams.set(key,value));
      target.searchParams.set("tab","forgot");
      window.location.replace(target.href+window.location.hash);
    })();
  </script>
  <meta name="description" content="AllonaHub şifre sıfırlama.">
  <link rel="stylesheet" href="../../css/styles.v2.css?v=20260620-wide1">
  <link rel="stylesheet" href="../../css/platform.css?v=20260626-mobile-std25">
</head>
<body>
  <div class="site-shell">
    <div data-layout="header"></div>
    <main class="site-main auth-layout">
      <section class="auth-card">
        <div>
          <p class="eyebrow">Hesap</p>
          <h1>Şifre Sıfırla</h1>
        </div>
        <div data-auth-status></div>
        <form data-forgot-form>
          <div class="field">
            <label for="forgot-email">E-posta</label>
            <input id="forgot-email" type="email" name="email" required autocomplete="email">
          </div>
          <div class="form-actions">
            <button class="btn btn--full" type="submit">Bağlantı Gönder</button>
          </div>
        </form>
        <p class="auth-switch"><a href="user.html">Girişe dön</a></p>
      </section>
    </main>
    <div data-layout="footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../../js/config.js?v=20260619-live5" defer></script>
  <script src="../../js/core.js?v=20260623-locnav1" defer></script>
  <script src="../../js/supabase-client.js?v=20260623-reset1" defer></script>
  <script src="../../js/auth.js?v=20260623-mfa2" defer></script>
  <script src="../../js/cart.js?v=20260621-tx1" defer></script>
  <script src="../../js/layout.v3.js?v=20260626-mobile-std25" defer></script>
  <script src="../../js/auth-pages.js?v=20260623-mfa2" defer></script>
  <script src="../../js/platform.js?v=20260626-mobile-std25" defer></script>
</body>
</html>
