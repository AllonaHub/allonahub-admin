<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş Yap | AllonaHub</title>
  <link rel="canonical" href="user.html">
  <meta http-equiv="refresh" content="0; url=user.html">
  <script>
    (function(){
      const target=new URL("user.html", window.location.href);
      new URLSearchParams(window.location.search).forEach((value,key)=>target.searchParams.set(key,value));
      target.searchParams.set("tab","login");
      window.location.replace(target.href+window.location.hash);
    })();
  </script>
  <meta name="description" content="AllonaHub hesabınıza giriş yapın.">
  <link rel="stylesheet" href="../../css/styles.v2.css?v=20260620-wide1">
  <link rel="stylesheet" href="../../css/platform.css?v=20260626-mobile-std1">
</head>
<body>
  <div class="site-shell">
    <div data-layout="header"></div>
    <main class="site-main auth-layout">
      <section class="auth-card">
        <div>
          <p class="eyebrow">Hesap</p>
          <h1>Giriş Yap</h1>
        </div>
        <form data-login-form>
          <div class="field">
            <label for="login-email">E-posta</label>
            <input id="login-email" type="email" name="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="login-password">Şifre</label>
            <input id="login-password" type="password" name="password" required autocomplete="current-password">
          </div>
          <div class="form-actions">
            <button class="btn btn--full" type="submit">Giriş Yap</button>
          </div>
        </form>
        <div class="auth-divider"><span>veya</span></div>
        <button class="btn btn--light btn--full auth-google" type="button" data-google-login data-return-to="user-panel.html">
          <span aria-hidden="true">G</span>
          Google ile Giriş Yap
        </button>
        <div data-auth-status></div>
        <p class="auth-switch"><a href="user.html?tab=forgot">Şifremi unuttum</a> · <a href="user.html?tab=register">Kayıt ol</a></p>
      </section>
    </main>
    <div data-layout="footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../../js/config.js?v=20260619-cvpay2" defer></script>
  <script src="../../js/core.js?v=20260623-locnav1" defer></script>
  <script src="../../js/supabase-client.js?v=20260623-reset1" defer></script>
  <script src="../../js/auth.js?v=20260623-mfa2" defer></script>
  <script src="../../js/cv-access.js?v=20260619-payform1" defer></script>
  <script src="../../js/cart.js?v=20260621-tx1" defer></script>
  <script src="../../js/layout.v3.js?v=20260626-mobile-std1" defer></script>
  <script src="../../js/auth-pages.js?v=20260623-mfa2" defer></script>
  <script src="../../js/platform.js?v=20260626-mobile-std1" defer></script>
</body>
</html>
