<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1320, initial-scale=0.35, maximum-scale=1.0, user-scalable=yes">
<title>AllonaHub Şifre Yenileme</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
:root{--blue:#0077ff;--neon:#00d5ff;--deep:#0a2540;--muted:#6b7b8f;--line:rgba(0,150,255,.22)}
body{min-width:1320px;background:linear-gradient(135deg,#fff,#f4fbff,#fff);color:#102033}
.page{width:1320px;margin:0 auto;padding:80px 22px}
.box{width:560px;margin:0 auto;padding:38px;border-radius:28px;background:white;border:1px solid var(--line);box-shadow:0 0 28px rgba(0,213,255,.15);text-align:center}
h1{color:var(--deep);font-size:38px;margin-bottom:12px}
p{color:var(--muted);line-height:1.6;margin-bottom:24px}
.input{height:56px;border-radius:17px;background:#f7fcff;border:1px solid rgba(0,150,255,.22);padding:0 16px;margin-bottom:14px}
.input input{width:100%;height:100%;background:transparent;border:0;outline:0;font-size:15px;color:#102033}
.btn{width:100%;height:56px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--neon),var(--blue));color:white;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 0 24px rgba(0,213,255,.36)}
a{display:block;margin-top:18px;color:var(--blue);font-weight:900;text-decoration:none}
</style>
  <link rel="stylesheet" href="css/platform.css?v=20260619-live9">
</head>

<body>
<div class="page">
  <div class="box">
    <h1>Şifre Yenile</h1>
    <p>Yeni şifreni oluştur. Şifre en az 6 karakter olmalıdır.</p>

    <div class="input">
      <input id="newPassword" type="password" placeholder="Yeni şifre">
    </div>

    <div class="input">
      <input id="newPassword2" type="password" placeholder="Yeni şifre tekrar">
    </div>

    <button class="btn" onclick="updatePassword()">Şifreyi Güncelle</button>

    <a href="login.html">Giriş Sayfasına Dön</a>
  </div>
</div>

<script>
const SUPABASE_URL="https://xqvikrysciguzholdjeb.supabase.co";
const SUPABASE_KEY="sb_publishable_-P8KULtNFK5D9XRAeJrdng_zTCZ8zdF";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function updatePassword(){
  const p1=document.getElementById("newPassword").value;
  const p2=document.getElementById("newPassword2").value;

  if(!p1 || !p2){
    alert("Lütfen iki şifre alanını da doldur.");
    return;
  }

  if(p1.length<6){
    alert("Şifre en az 6 karakter olmalıdır.");
    return;
  }

  if(p1!==p2){
    alert("Şifreler aynı değil.");
    return;
  }

  const { error } = await supabaseClient.auth.updateUser({
    password:p1
  });

  if(error){
    alert(error.message);
    return;
  }

  alert("Şifren başarıyla güncellendi ✅");
  window.location.href="user.html";
}
</script>
  <div data-layout="footer"></div>
  <script src="js/core.js?v=20260619-live5" defer></script>
  <script src="js/layout.v3.js?v=20260619-live9" defer></script>
  <script src="js/platform.js?v=20260619-live9" defer></script>
</body>
</html>
