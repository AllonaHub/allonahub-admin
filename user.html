<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1320, initial-scale=0.35, maximum-scale=1.0, user-scalable=yes">
<title>AllonaHub Kullanıcı Paneli</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{min-width:1320px;background:#020814;color:white;overflow-x:auto}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at top left,#00b7ff44,transparent 35%),radial-gradient(circle at bottom right,#ffd70022,transparent 30%),linear-gradient(135deg,#020814,#061b33,#002b4d)}
.panel{width:1320px;margin:0 auto;padding:28px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(0,229,255,.25);border-radius:28px;padding:24px}
.top{display:grid;grid-template-columns:300px 1fr 1fr 1fr;gap:18px}
.profile{text-align:center}
.avatar{width:130px;height:130px;border-radius:50%;margin:auto;background:linear-gradient(135deg,#063d78,#031226)}
.money h2{color:#00e5ff}
</style>
</head>

<body>

<div class="panel">

<div class="top">

<div class="card profile">
<div class="avatar"></div>
<h2>Misafir Kullanıcı</h2>
<p>Üye No: 000000001</p>
</div>

<div class="card money">
<h4>TOPLAM HP</h4>
<h2>250 HP</h2>
</div>

<div class="card money">
<h4>CASHOUT</h4>
<h2>0,00 ₺</h2>
</div>

<div class="card money">
<h4>HUB CASH</h4>
<h2>0,00 ₺</h2>
</div>

</div>

</div>

</body>
</html>
