<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AllonaHub Giriş</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#020814;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:420px;
max-width:95%;
background:#081625;
padding:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(0,180,255,.25);
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-bottom:12px;
border:none;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
margin-bottom:10px;
}

.primary{
background:#00bfff;
color:white;
}

.google{
background:white;
color:black;
}

.link{
text-align:center;
cursor:pointer;
margin-top:10px;
color:#8ddcff;
}

.form{
display:none;
}

.form.active{
display:block;
}
</style>
</head>

<body>

<div class="card">

<h1>AllonaHub</h1>

<div id="login" class="form active">

<input id="loginEmail" placeholder="E-posta">

<input id="loginPassword" type="password" placeholder="Şifre">

<button class="primary" onclick="LoginUser()">
Giriş Yap
</button>

<button class="google" onclick="LoginWithGoogle()">
Google ile Giriş Yap
</button>

<div class="link" onclick="showRegister()">
Ücretsiz Hesap Oluştur
</div>

</div>

<div id="register" class="form">

<input id="registerEmail" placeholder="E-posta">

<input id="password1" type="password" placeholder="Şifre">

<input id="password2" type="password" placeholder="Şifre Tekrar">

<button class="primary" onclick="registerUser()">
Ücretsiz Hesap Oluştur
</button>

<div class="link" onclick="showLogin()">
Girişe Dön
</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://xqvikrysciguzholdjeb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-P8KULtNFK5D9XRAeJrdng_zTCZ8zdF";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

function showRegister(){
document.getElementById("login").classList.remove("active");
document.getElementById("register").classList.add("active");
}

function showLogin(){
document.getElementById("register").classList.remove("active");
document.getElementById("login").classList.add("active");
}

async function registerUser(){

const email =
document.getElementById("registerEmail").value;

const password =
document.getElementById("password1").value;

const password2 =
document.getElementById("password2").value;

if(password!==password2){
alert("Şifreler aynı değil");
return;
}

const { error } =
await supabaseClient.auth.signUp({
email,
password
});

if(error){
alert(error.message);
return;
}

alert("Kayıt başarılı. E-postanı kontrol et.");
}

async function LoginUser(){

const email =
document.getElementById("loginEmail").value;

const password =
document.getElementById("loginPassword").value;

const { error } =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){
alert(error.message);
return;
}

alert("Giriş başarılı");
window.location.href="index.html";
}

async function LoginWithGoogle(){

await supabaseClient.auth.signInWithOAuth({
provider:"google",
options:{
redirectTo:
"https://allonahub.github.io/allonahub-admin/user.html"
}
});

}

</script>

</body>
</html>
